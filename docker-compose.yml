services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ${KNOWLEDGE_BASE_DIR:-/Users/zxz/Desktop/ppt/知识库}:/knowledge-base
    environment:
      KNOWLEDGE_BASE_DIR: /knowledge-base
      INDEX_STATE_PATH: /app/backend/data/index_state.json
      RAG_DB_PATH: /app/backend/data/rag.sqlite3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  index-worker:
    build: ./backend
    env_file: .env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/backend/data
      - ${KNOWLEDGE_BASE_DIR:-/Users/zxz/Desktop/ppt/知识库}:/knowledge-base:ro
    environment:
      KNOWLEDGE_BASE_DIR: /knowledge-base
      INDEX_STATE_PATH: /app/backend/data/index_state.json
      RAG_DB_PATH: /app/backend/data/rag.sqlite3

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

