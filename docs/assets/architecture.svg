<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">CoursePilot AI architecture</title>
  <desc id="desc">A Next.js client calls a FastAPI service that coordinates local storage, incremental indexing, OpenAI Responses, and File Search.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#143c2b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172234" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#f5f2e9"/>
  <text x="64" y="72" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#171b16">CoursePilot AI architecture</text>
  <text x="64" y="105" font-family="system-ui,sans-serif" font-size="16" fill="#667064">Grounded answers, explicit evidence, incremental indexing, and local-first data controls</text>

  <g filter="url(#shadow)" font-family="system-ui,sans-serif">
    <rect x="64" y="170" width="250" height="130" rx="20" fill="#fffdf7" stroke="#d8d6cc"/>
    <text x="94" y="215" font-size="13" font-weight="700" letter-spacing="2" fill="#ff5a36">EXPERIENCE</text>
    <text x="94" y="252" font-size="24" font-weight="700" fill="#171b16">Next.js client</text>
    <text x="94" y="278" font-size="14" fill="#667064">Chat · citations · document UI</text>

    <rect x="472" y="150" width="260" height="170" rx="20" fill="#143c2b"/>
    <text x="502" y="198" font-size="13" font-weight="700" letter-spacing="2" fill="#ffb8a7">ORCHESTRATION</text>
    <text x="502" y="237" font-size="24" font-weight="700" fill="#ffffff">FastAPI service</text>
    <text x="502" y="267" font-size="14" fill="#c8d8ce">Validation · rate limits · retries</text>
    <text x="502" y="291" font-size="14" fill="#c8d8ce">Conversation and feedback APIs</text>

    <rect x="886" y="170" width="250" height="130" rx="20" fill="#fffdf7" stroke="#d8d6cc"/>
    <text x="916" y="215" font-size="13" font-weight="700" letter-spacing="2" fill="#ff5a36">GENERATION</text>
    <text x="916" y="252" font-size="24" font-weight="700" fill="#171b16">Responses API</text>
    <text x="916" y="278" font-size="14" fill="#667064">GPT-6 Luna + File Search</text>

    <rect x="64" y="410" width="300" height="130" rx="20" fill="#fffdf7" stroke="#d8d6cc"/>
    <text x="94" y="455" font-size="13" font-weight="700" letter-spacing="2" fill="#ff5a36">PRIVATE DATA</text>
    <text x="94" y="492" font-size="24" font-weight="700" fill="#171b16">Course library</text>
    <text x="94" y="518" font-size="14" fill="#667064">PDF · PPTX · DOCX · TXT · MD</text>

    <rect x="450" y="410" width="300" height="130" rx="20" fill="#fffdf7" stroke="#d8d6cc"/>
    <text x="480" y="455" font-size="13" font-weight="700" letter-spacing="2" fill="#ff5a36">LOCAL STATE</text>
    <text x="480" y="492" font-size="24" font-weight="700" fill="#171b16">SQLite + JSON</text>
    <text x="480" y="518" font-size="14" fill="#667064">History · feedback · hashes · IDs</text>

    <rect x="836" y="410" width="300" height="130" rx="20" fill="#fffdf7" stroke="#d8d6cc"/>
    <text x="866" y="455" font-size="13" font-weight="700" letter-spacing="2" fill="#ff5a36">RETRIEVAL</text>
    <text x="866" y="492" font-size="24" font-weight="700" fill="#171b16">Vector stores</text>
    <text x="866" y="518" font-size="14" fill="#667064">Per-course, per-material scope</text>
  </g>

  <g fill="none" stroke="#143c2b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M314 235 H455"/>
    <path d="M732 235 H869"/>
    <path d="M215 410 C215 350 430 360 490 320"/>
    <path d="M600 410 V338"/>
    <path d="M986 410 C986 350 770 360 710 320"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="12" fill="#667064">
    <text x="351" y="222">JSON / HTTP</text>
    <text x="767" y="222">grounded request</text>
    <text x="251" y="365">incremental scanner</text>
    <text x="610" y="373">atomic writes</text>
    <text x="793" y="365">retrieved evidence</text>
  </g>
</svg>
