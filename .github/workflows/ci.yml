name: CoursePilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: coursepilot_test
          POSTGRES_USER: coursepilot_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coursepilot_test -d coursepilot_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      COURSEPILOT_TEST_DATABASE_URL: postgresql://coursepilot_test:test-only-password@127.0.0.1:5432/coursepilot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check app tests ../frontend/api scripts/export_demo_index.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Validate fictional evaluation dataset (no API calls)
        run: python -m app.benchmark --validate
      - name: Validate passage challenge and learning-task fixtures (no API calls)
        run: python -m app.challenge_suite
      - name: Agent service-contract evaluation (scripted, no API calls)
        run: python -m app.agent_evaluation

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
